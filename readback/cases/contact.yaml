# Emails, UPI IDs and URLs: punctuation has to be spoken ("dot", "at", "underscore").

- id: contact-001
  category: contact
  text: "Write to support@readback.in for help."
  critical: "support@readback.in"
  value: {type: email, address: "support@readback.in"}
  accept: ["support at readback dot in"]
  severity: high

