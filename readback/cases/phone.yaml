# Phone numbers. Scored on the digit-string reading, so "double five" and
# "ninety eight" groupings both count as long as the digits come out right.

- id: phone-001
  category: phone
  text: "Call +91 98765 43210 for support."
  critical: "+91 98765 43210"
  value: {type: digits, digits: "919876543210"}
  accept: ["plus nine one nine eight seven six five four three two one zero"]
  severity: high

- id: phone-002
  category: phone
  text: "Our office number is 022-2345 6789."
  critical: "022-2345 6789"
  value: {type: digits, digits: "02223456789"}
  severity: high

- id: phone-003
